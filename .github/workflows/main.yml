name: Render 30-sec Comedy Short

on:
workflow_dispatch:

permissions:
contents: read

jobs:
render:
runs-on: ubuntu-latest
timeout-minutes: 30
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install FFmpeg
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg

  - name: Install dependencies
    run: npm install

  - name: Render video
    run: npm run render

  - name: Upload MP4
    uses: actions/upload-artifact@v4
    with:
      name: meeting-comedy-mp4
      path: out/meeting-comedy.mp4
      if-no-files-found: error
      retention-days: 7
```
